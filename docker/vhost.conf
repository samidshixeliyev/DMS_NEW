<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Log to the container's stdout/stderr so `docker logs` works.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
